# Strict headers everywhere, relaxed CSP only for the FastAPI docs UI.
# Used by exact-match /docs, /redoc and /openapi.json locations in the
# API server block. CSP allows cdn.jsdelivr.net (Swagger + ReDoc assets)
# and 'unsafe-inline' (FastAPI embeds an inline init script and a style).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
add_header X-Frame-Options           "DENY" always;
add_header X-Content-Type-Options    "nosniff" always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Content-Security-Policy   "default-src 'self' https://cdn.jsdelivr.net; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https://fastapi.tiangolo.com https://cdn.jsdelivr.net; connect-src 'self' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;