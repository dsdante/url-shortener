services:
  # -------------------------------------------------------------------------
  # Application — no published ports, no outbound internet on the default
  # (internal) network. Only reachable by nginx.
  # -------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: url-shortener:latest
    container_name: url-shortener
    init: true
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      DATABASE_URL: "${DATABASE_URL:-sqlite:////app/data/links.db}"
      CHECK_URL_AVAILABILITY: "${CHECK_URL_AVAILABILITY:-false}"
      HTTP_TIMEOUT: "${HTTP_TIMEOUT:-5.0}"
      HTTP_RETRIES: "${HTTP_RETRIES:-2}"
      ENABLE_DOCS: "${ENABLE_DOCS:-false}"
      # Uvicorn trusts X-Forwarded-* only from nginx's subnet.
      FORWARDED_ALLOW_IPS: "172.28.0.0/16"
    volumes:
      - url-shortener-data:/app/data
    networks:
      - edge
      - internal
    # --- container hardening ---
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 200
    mem_limit: 512m
    cpus: "1.0"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import sys, urllib.request
          try:
              r = urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=2)
              sys.exit(0 if r.status == 200 else 1)
          except Exception:
              sys.exit(1)
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

  ui-build:
    build:
      context: ./ui
      dockerfile: Dockerfile
    image: url-shortener-ui:latest
    container_name: url-shortener-ui-build
    restart: "no"
    volumes:
      - ui-dist:/out
    networks:
      - internal

  # -------------------------------------------------------------------------
  # Nginx — unprivileged image, the only service with host ports.
  # Listens on 8080/8443 internally; Docker maps 80/443.
  # -------------------------------------------------------------------------
  nginx:
    image: nginxinc/nginx-unprivileged:1.29-alpine
    container_name: url-shortener-nginx
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
      ui-build:
        condition: service_completed_successfully
    ports:
      - "80:8080"
      - "443:8443"
    environment:
      DOMAIN: "${DOMAIN:-api.short.example.com}"
      UI_DOMAIN: "${UI_DOMAIN:-short.example.com}"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
      - ui-dist:/usr/share/nginx/html:ro
    networks:
      - edge
      - internal
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3

  # -------------------------------------------------------------------------
  # Certbot — renewal loop. Initial issuance is done by
  # deploy/init-letsencrypt.sh, not by this service.
  # -------------------------------------------------------------------------
  certbot:
    image: certbot/certbot:latest
    container_name: url-shortener-certbot
    restart: unless-stopped
    depends_on:
      nginx:
        condition: service_started
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot
      - ./deploy/certbot-deploy-hook.sh:/etc/letsencrypt/renewal-hooks/deploy/01-nginx-unprivileged.sh:ro
    networks:
      - edge
    entrypoint: >
      sh -c "trap exit TERM;
      while :; do
        certbot renew --webroot -w /var/www/certbot --quiet;
        sleep 12h & wait $${!};
      done"

  # -------------------------------------------------------------------------
  # Optional Postgres — never published, internal network only.
  # -------------------------------------------------------------------------
