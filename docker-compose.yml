  #  restart: unless-stopped
  #  environment:
  #    POSTGRES_USER: "${POSTGRES_USER:-urls}"
  #    POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-urls}"
  #    POSTGRES_DB: "${POSTGRES_DB:-urls}"
  #  volumes:
  #    - url-shortener-pgdata:/var/lib/postgresql/data
  #  networks:
  #    - internal
  #  security_opt:
  #    - no-new-privileges:true
  #  cap_drop: [ALL]
  #  healthcheck:
  #    test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
  #    interval: 10s
