[pytest]
testpaths = tests
filterwarnings =
    # starlette.testclient resolves anyio.abc.BlockingPortal at import time;
    # anyio 4.15 deprecated that alias. The fix is in starlette 1.7.0
    # (PR #3498), but fastapi 0.119.1 pins starlette<0.49.0, so we cannot
    # install it. Remove this line once fastapi allows starlette >= 1.7.0.
    ignore:The anyio\.abc\.BlockingPortal alias is deprecated:DeprecationWarning